[package]
name = "nearscreen-receiver"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Desktop receiver for Nearscreen — shows an iPhone screen streamed over the local network"
repository = "https://github.com/nearscreen/receiver"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
gethostname = "1.1.0"
if-addrs = "0.15.0"
log = "0.4.34"
mdns-sd = "0.21.1"
qrcode = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
softbuffer = "0.4.8"
swash = "0.2.10"
tray-icon = "0.24.2"
winit = "0.30.13"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation", "Win32_Media_KernelStreaming", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", features = ["CFBase", "CFDictionary", "CFArray"] }
objc2-core-media = { version = "0.3.2", features = ["CMBase", "CMTime", "CMFormatDescription", "CMBlockBuffer", "CMSampleBuffer"] }
objc2-core-video = { version = "0.3.2", features = ["CVBase", "CVReturn", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-video-toolbox = { version = "0.3.2", features = ["VTDecompressionSession", "VTErrors", "VTSession", "objc2-core-media", "objc2-core-video"] }
