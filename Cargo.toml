[package]
name = "nearscreen-receiver"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Desktop receiver for Nearscreen — shows an iPhone screen streamed over the local network"
repository = "https://github.com/nearscreen/receiver"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
gethostname = "1.1.0"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true
